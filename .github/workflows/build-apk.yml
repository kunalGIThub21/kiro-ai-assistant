name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'kiro-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Install kiro-mobile dependencies
        working-directory: kiro-mobile
        run: |
          npm install
          npx expo install expo-asset

      - name: 6. Generate Native Android Project
        working-directory: kiro-mobile
        run: npx expo prebuild --platform android --clean

      - name: 6.5. Patch Native Android Configuration for Standalone Bundling
        working-directory: kiro-mobile
        run: python scripts/patch-android-build.py

      - name: 7. Build Standalone Android APK via Gradle
        working-directory: kiro-mobile/android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "kotlinVersion=1.9.25" >> gradle.properties
          echo "android.suppressKotlinVersionCompatibilityCheck=true" >> gradle.properties
          echo "android.enableProguardInReleaseBuilds=false" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PkotlinVersion=1.9.25 || ./gradlew assembleDebug --no-daemon -PkotlinVersion=1.9.25

      - name: 8. Find and Stage APK
        run: |
          mkdir -p apk_output
          RELEASE_APK=$(find kiro-mobile/android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Staging release APK from: $RELEASE_APK"
            cp "$RELEASE_APK" apk_output/kiro-ai-assistant.apk
          else
            DEBUG_APK=$(find kiro-mobile/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
            echo "Staging fallback APK from: $DEBUG_APK"
            cp "$DEBUG_APK" apk_output/kiro-ai-assistant.apk
          fi
          ls -lh apk_output/kiro-ai-assistant.apk

      - name: 9. Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiro-AI-Assistant-APK
          path: apk_output/kiro-ai-assistant.apk

      - name: 10. Publish APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-apk-release-${{ github.run_number }}
          name: "Kiro AI Android App v1.0.${{ github.run_number }} (.apk)"
          body: "Direct standalone Android APK build of Kiro AI Assistant (offline bundled JS, no Metro required). Download and install on your phone."
          files: apk_output/kiro-ai-assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
