name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'kiro-mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Install kiro-mobile dependencies
        working-directory: kiro-mobile
        run: npm install

      - name: 6. Generate Native Android Project
        working-directory: kiro-mobile
        run: npx expo prebuild --platform android --clean

      - name: 7. Build Android Debug APK via Gradle
        working-directory: kiro-mobile/android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon

      - name: 8. Locate and Stage APK
        run: |
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" ./kiro-ai-assistant.apk
          ls -la ./kiro-ai-assistant.apk

      - name: 9. Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiro-AI-Assistant-APK
          path: ./kiro-ai-assistant.apk
          if-no-files-found: error

      - name: 10. Publish APK Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: android-apk-latest
          name: "Kiro AI Android App (.apk)"
          body: "Direct standalone Android APK build of Kiro AI Assistant. Download and install on your phone."
          files: ./kiro-ai-assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
